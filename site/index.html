<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="술결 — 내 취향을 발견하고, 입에 딱 맞는 실패 없는 한 잔을 알려드려요.">
  <title>술결</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/landing.css">
<script src="/assets/analytics.js" async></script>
<script src="/assets/preview.js" defer></script>

<body>
<main>
  <section class="hero">
    <h1 class="brand"><img class="logo" src="/assets/logo.svg" alt="술결" width="70" height="50"></h1>

    <div class="preview" aria-roledescription="carousel" aria-label="술결 앱 화면">
      <ol class="slides" tabindex="0">
        <li aria-roledescription="slide" aria-label="1 / 4">
          <p class="lead">마신 술 한 잔만 기록하면</p>
          <h2 class="title">내 취향 분석부터 다음 술 가이드까지</h2>
          <img class="shot" src="/assets/preview_card.webp" alt="발베니 더블우드 12년 술결카드: 선명한 스위트 러버, 다음 술은 이렇게 골라보세요" width="878" height="1404">
        </li>
        <li aria-roledescription="slide" aria-label="2 / 4">
          <p class="lead">취향 데이터가 쌓이면</p>
          <h2 class="title">라벨만 찍어도 내 입맛인지 바로 확인</h2>
          <img class="shot" src="/assets/preview_fit.webp" alt="발베니 더블우드 12년, 딱 맞는 PICK" width="878" height="1404" loading="lazy">
        </li>
        <li aria-roledescription="slide" aria-label="3 / 4">
          <p class="lead">어려운 술 용어, 검색할 필요 없이</p>
          <h2 class="title">모르는 단어만 톡 눌러서 확인</h2>
          <img class="shot" src="/assets/preview_term.webp" alt="다중 캐스크 블렌드를 누르면 뜨는 풀이" width="878" height="1404" loading="lazy">
        </li>
        <li aria-roledescription="slide" aria-label="4 / 4">
          <p class="lead">기록이 쌓일수록</p>
          <h2 class="title">나만의 취향 카드 완성</h2>
          <img class="shot" src="/assets/preview_taste.webp" alt="나의 취향 조각: 풍, 달, 가, 길" width="878" height="1404" loading="lazy">
        </li>
      </ol>
    </div>

    <a class="try" href="https://app.soolgyul.com/">1분 만에 내 취향 알아보기</a>
  </section>

  <section class="download" aria-label="앱 다운로드">
    <!-- 출시 전 확정: 스토어 주소로 연결되는 QR 코드 -->
    <div class="qr placeholder" aria-hidden="true">QR</div>
    <div class="badges">
      <!-- 출시 전 확정: 스토어 주소 -->
      <a href="#" aria-label="App Store에서 다운로드하기"><img src="/assets/app_store_ko.svg" alt="App Store에서 다운로드하기" height="48"></a>
      <a href="#" aria-label="Google Play에서 다운로드"><img src="/assets/google_play_ko.png" alt="Google Play에서 다운로드" height="48"></a>
    </div>
  </section>
</main>

<footer>

</html>
