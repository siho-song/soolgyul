<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="내 취향을 발견하고, 입에 딱 맞는 실패 없는 한 잔을 알려드려요.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="술결">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>술결</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // The service worker keeps the previous build's script in its cache and
    // only switches after another visit, which can pair old code with fresh
    // bundled files. Reload once as soon as a newer worker takes over.
    if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
      var reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (reloaded) return;
        reloaded = true;
        window.location.reload();
      });
    }
  </script>
  <script>
    // Told to Google Analytics before it starts (only the released product
    // starts it): a visit is counted under the page and the campaign that
    // sent the visitor (utm_*), never the rest of the address, such as a
    // sign-in code; and nothing is handed to advertising.
    (function () {
      var campaign = new URLSearchParams();
      new URLSearchParams(location.search).forEach(function (value, key) {
        if (key.indexOf("utm_") === 0) campaign.append(key, value);
      });
      var query = campaign.toString();
      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }
      gtag("set", {
        page_location: location.origin + location.pathname + (query ? "?" + query : ""),
        allow_google_signals: false,
        allow_ad_personalization_signals: false
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
