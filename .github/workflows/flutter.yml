name: Flutter

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.6

jobs:
  backend:
    name: Docs, catalog and Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Verify catalog preprocessing contracts
        run: |
          python3 -m pip install pytest jsonschema pillow
          python3 -m pytest -q

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
          cache-hash: ${{ hashFiles('supabase/functions/**/*.ts', 'supabase/functions/**/deno.json') }}

      - name: Verify Supabase Edge Functions
        run: |
          deno fmt --check supabase/functions
          deno test --allow-read --allow-env supabase/functions/_tests

  analyze:
    name: Format and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

  test:
    name: Test (shard ${{ matrix.shard }} of 2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Each test file costs a few seconds to load, so the files themselves are
      # split between the shards (flutter's own --total-shards splits tests
      # inside every file and still loads them all).
      - name: Test
        run: |
          files=$(find test -name '*_test.dart' | sort | awk -v k=${{ matrix.shard }} 'NR % 2 == k')
          echo "$files"
          flutter test $files

  web:
    name: Web release build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build web release
        run: flutter build web --release

      - name: Keep debug design tools out of release
        run: |
          if grep -Fq "Design Lab" build/web/main.dart.js; then
            echo "Development-only Design Lab code was bundled into the release."
            exit 1
          fi
