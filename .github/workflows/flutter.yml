name: Flutter

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.6

jobs:
  backend:
    name: Docs, catalog and Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Verify catalog preprocessing contracts
        run: |
          python3 -m pip install pytest jsonschema pillow
          python3 -m pytest -q

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
          cache-hash: ${{ hashFiles('supabase/functions/**/*.ts', 'supabase/functions/**/deno.json') }}

      - name: Verify Supabase Edge Functions
        run: |
          deno fmt --check supabase/functions
          deno test --allow-read --allow-env supabase/functions/_tests

  analyze:
    name: Format and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

  test:
    name: Test (shard ${{ matrix.shard }} of 2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Each test file costs a few seconds to load, so the files themselves are
      # split between the shards (flutter's own --total-shards splits tests
      # inside every file and still loads them all).
      - name: Test
        run: |
          files=$(find test -name '*_test.dart' | sort | awk -v k=${{ matrix.shard }} 'NR % 2 == k')
          echo "$files"
          flutter test $files

  web:
    name: Web release build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build web release
        run: flutter build web --release

      - name: Keep debug design tools out of release
        run: |
          if grep -Fq "Design Lab" build/web/main.dart.js; then
            echo "Development-only Design Lab code was bundled into the release."
            exit 1
          fi

  # Temporary, for the refactor: a refactor/* branch must leave every guarded
  # screen pixel-identical and every card case word-identical to the commit it
  # branched from. Any other pull request only has to keep the guard's
  # scenarios running, so a feature change updates them along the way.
  # Removed with refactor_guard/ when the refactor ends.
  guard:
    name: Refactor guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Pillow
        run: python3 -m pip install pillow

      - name: Draw the commit this branch started from
        if: startsWith(github.head_ref, 'refactor/')
        run: |
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          echo "base $base"
          git worktree add "$RUNNER_TEMP/base" "$base"
          cd "$RUNNER_TEMP/base"
          # The pull request that adds the guard draws its base with its own guard.
          [ -d refactor_guard ] || cp -R "$GITHUB_WORKSPACE/refactor_guard" .
          flutter pub get
          bash refactor_guard/run.sh "$RUNNER_TEMP/guard-base"

      - name: Draw this branch
        run: |
          flutter pub get
          bash refactor_guard/run.sh "$RUNNER_TEMP/guard-head"

      - name: Compare
        if: startsWith(github.head_ref, 'refactor/')
        run: python3 refactor_guard/compare.py "$RUNNER_TEMP/guard-base" "$RUNNER_TEMP/guard-head" "$RUNNER_TEMP/guard-diff"

      - name: Keep the differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: refactor-guard-diff
          path: ${{ runner.temp }}/guard-diff
          if-no-files-found: ignore
